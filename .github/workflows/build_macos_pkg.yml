name: Build macOS Release Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64)

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.4.0

    - name: Build Executable
      run: |
        pyinstaller --onefile --console --name semi-utils --target-arch arm64 main.py
        file dist/semi-utils

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: semi-utils-macos-arm64
        path: dist/semi-utils
